name: ballerinax-db2-tests
services:
    db2:
        image: icr.io/db2_community/db2:12.1.2.0
        container_name: ballerina-db2
        privileged: true
        environment:
            LICENSE: accept
            DB2INSTANCE: db2inst1
            DB2INST1_PASSWORD: "Test123#"
            DBNAME: TESTDB
            ARCHIVE_LOGS: "false"
            AUTOCONFIG: "false"
        ports:
            - "50000:50000"
        volumes:
            - ./custom:/var/custom:ro
        healthcheck:
            # TESTDB2 is created by custom/create-second-database.sh once the instance setup completes.
            test: su - db2inst1 -c "db2 connect to TESTDB2" > /dev/null
            interval: 15s
            timeout: 30s
            retries: 60
            start_period: 120s
