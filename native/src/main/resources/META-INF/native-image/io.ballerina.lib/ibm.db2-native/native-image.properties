# The JCC driver converts between the EBCDIC and Unicode code pages of the server. Its message bundles are
# classes, which the image builder loads while registering them, so they have to be initialized at build time.
Args =  -H:+AddAllCharsets \
        --report-unsupported-elements-at-runtime \
        --initialize-at-build-time=com.ibm.db2.jcc.resources.Resources,com.ibm.db2.jcc.resources.Resources_en_US,com.ibm.db2.jcc.resources.T4Resources,com.ibm.db2.jcc.resources.T4Resources_en_US,com.ibm.db2.jcc.resources.SqljResources,com.ibm.db2.jcc.resources.SqljResources_en_US,com.ibm.db2.jcc.t2zos.ac
