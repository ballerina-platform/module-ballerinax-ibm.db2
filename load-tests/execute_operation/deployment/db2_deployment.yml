## Db2 data storage
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: db2-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db2-deployment
spec:
  selector:
    matchLabels:
      app: db2
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: db2
        logs: "true"
    spec:
      containers:
        - name: db2-server
          image: icr.io/db2_community/db2:12.1.2.0
          securityContext:
            privileged: true
          env:
            - name: LICENSE
              value: accept
            - name: DB2INSTANCE
              value: db2inst1
            - name: DB2INST1_PASSWORD
              value: Test123#
            - name: DBNAME
              value: EXAMPLE
            - name: ARCHIVE_LOGS
              value: "false"
          ports:
            - containerPort: 50000
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "su - db2inst1 -c 'db2 connect to EXAMPLE' > /dev/null"]
            initialDelaySeconds: 120
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /database
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db2-data-pvc
---
## Service
apiVersion: v1
kind: Service
metadata:
  name: db2-service
  labels:
    app: db2-server
spec:
  type: NodePort
  ports:
    - port: 50000
      targetPort: 50000
      protocol: TCP
  selector:
    app: db2
